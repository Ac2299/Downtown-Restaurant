<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOWNTOWN | Premium Café & Desserts</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090B0A;
            --bg-card: rgba(18, 25, 22, 0.75);
            --accent-gold: #D4AF37;
            --accent-gold-light: #F3E5AB;
            --accent-emerald: #00F5A0;
            --text-main: #F0F4F1;
            --text-muted: #9BAA9E;
            --border-glass: rgba(212, 175, 55, 0.2);
            --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 4px; }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(9, 11, 10, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glass);
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--accent-gold);
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
            transform: translateY(-2px);
        }

        .cart-badge {
            background: #ff4757;
            color: white;
            padding: 2px 7px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        /* Hero Section */
        header.hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding: 0 20px;
            background: radial-gradient(circle at center, rgba(0,245,160,0.08) 0%, rgba(9,11,10,1) 75%);
        }

        .hero-content {
            max-width: 900px;
            z-index: 2;
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            letter-spacing: 5px;
            color: var(--accent-gold);
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInSlide 1s forwards 0.3s;
        }

        .hero p.tagline {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInSlide 1s forwards 0.6s;
        }

        .hero p.sub {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 35px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInSlide 1s forwards 0.9s;
        }

        @keyframes fadeInSlide {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Menu Section */
        section {
            padding: 90px 40px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-card:hover {
            border-color: rgba(212, 175, 55, 0.5);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .menu-img {
            height: 220px;
            background: #141c18;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .menu-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .menu-card:hover .menu-img img {
            transform: scale(1.08);
        }

        .menu-details {
            padding: 25px;
        }

        .menu-details h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .menu-details p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-emerald);
        }

        .add-btn {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
            transform: scale(1.05);
        }

        /* Cart Sidebar Drawer */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: 0.3s ease;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            max-width: 100%;
            height: 100%;
            background: #0D1310;
            border-left: 1px solid var(--border-glass);
            z-index: 2001;
            display: flex;
            flex-direction: column;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.8);
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 25px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.3rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-cart:hover { color: var(--accent-gold); }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h4 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .cart-item-info span {
            color: var(--accent-emerald);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: var(--bg-deep);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { border-color: var(--accent-gold); }

        .cart-footer {
            padding: 25px;
            border-top: 1px solid var(--border-glass);
            background: rgba(8,11,10,0.9);
        }

        .order-type-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
        }

        .type-btn.active {
            background: var(--accent-gold);
            color: var(--bg-deep);
            border-color: var(--accent-gold);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .cart-total span:last-child {
            color: var(--accent-emerald);
        }

        .checkout-btn {
            width: 100%;
            background: var(--accent-emerald);
            color: #090B0A;
            border: none;
            padding: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #00c982;
            box-shadow: 0 0 20px rgba(0,245,160,0.4);
        }

        .checkout-btn:disabled {
            background: #2a3630;
            color: #61736b;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--border-glass);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media(max-width: 768px) {
            nav { padding: 15px 20px; }
            .hero h1 { font-size: 2.8rem; }
            section { padding: 60px 20px; }
            .cart-drawer { width: 100%; right: -100%; }
        }
    </style>
</head>
<body data-lang="en">

    <!-- Navbar -->
    <nav>
        <a href="#" class="logo" data-en="DOWNTOWN" data-ar="داون تاون">DOWNTOWN</a>
        <div class="nav-right">
            <button class="nav-btn" onclick="toggleLanguage()">
                <span id="langText">AR / EN</span>
            </button>
            <button class="nav-btn" onclick="toggleCart()">
                🛒 <span data-en="Cart" data-ar="السلة">Cart</span> 
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1 data-en="DOWNTOWN" data-ar="داون تاون">DOWNTOWN</h1>
            <p class="tagline" data-en="Savor the Luxury, Love the Brew." data-ar="استمتع بالفخامة، وأحب القهوة.">Savor the Luxury, Love the Brew.</p>
            <p class="sub" data-en="Advanced Café & Artisanal Desserts" data-ar="كافيه فاخر وحلويات استثنائية">Advanced Café & Artisanal Desserts</p>
        </div>
    </header>

    <!-- Menu Section -->
    <section id="menu">
        <div class="section-title">
            <h2 data-en="Our Signature Menu" data-ar="قائمتنا المميزة">Our Signature Menu</h2>
            <p data-en="Crafted with passion and finest ingredients" data-ar="مصنوعة بشغف وبأجود المكونات">Crafted with passion and finest ingredients</p>
        </div>
        <div class="menu-grid" id="menuGrid">
            <!-- Items rendered via JS -->
        </div>
    </section>

    <!-- Cart Sidebar Drawer -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3 data-en="Your Luxury Cart" data-ar="سلة طلباتك الفاخرة">Your Luxury Cart</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            <!-- Cart items added dynamically -->
        </div>
        <div class="cart-footer">
            <div class="order-type-box">
                <button class="type-btn active" id="typeDelivery" onclick="setOrderType('Delivery')" data-en="Delivery" data-ar="توصيل">Delivery</button>
                <button class="type-btn" id="typePickup" onclick="setOrderType('Pickup')" data-en="Pickup" data-ar="استلام من الفرع">Pickup</button>
            </div>
            <div class="cart-total">
                <span data-en="Total:" data-ar="الإجمالي:">Total:</span>
                <span id="cartTotalPrice">0 EGP</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" onclick="checkoutWhatsApp()" data-en="Order via WhatsApp" data-ar="اطلب عبر واتساب">Order via WhatsApp</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p data-en="© 2026 DOWNTOWN Café. All Rights Reserved." data-ar="© 2026 كافيه داون تاون. جميع الحقوق محفوظة.">© 2026 DOWNTOWN Café. All Rights Reserved.</p>
    </footer>

    <!-- Script منطق الموقع والسلة والواتساب والترجمة -->
    <script>
        const menuProducts = [
            { id: 1, nameEn: "Nutella Donut", nameAr: "نوتيلا دونتس", price: 120, img: "https://images.unsplash.com/photo-1621236378699-8599fac66a3d?w=500&auto=format&fit=crop&q=60" },
            { id: 2, nameEn: "Iced Spanish Latte", nameAr: "آيس سبانيش لاتيه", price: 110, img: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500&auto=format&fit=crop&q=60" },
            { id: 3, nameEn: "White Chocolate Waffle", nameAr: "وافل شوكولاتة بيضاء", price: 90, img: "https://images.unsplash.com/photo-1568051243851-f9b136146e97?w=500&auto=format&fit=crop&q=60" },
            { id: 4, nameEn: "Mini Pancakes", nameAr: "ميني بان كيك", price: 100, img: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=500&auto=format&fit=crop&q=60" },
            { id: 5, nameEn: "Signature Shake", nameAr: "ماتشا / شيك مميز", price: 130, img: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500&auto=format&fit=crop&q=60" },
            { id: 6, nameEn: "Hot Espresso & Brew", nameAr: "إسبريسو وقهوة ساخنة", price: 75, img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = JSON.parse(localStorage.getItem('downtown_cart')) || [];
        let currentLang = 'en';
        let orderType = 'Delivery';

        // Render Menu
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            menuProducts.forEach(item => {
                const name = currentLang === 'ar' ? item.nameAr : item.nameEn;
                grid.innerHTML += `
                    <div class="menu-card">
                        <div class="menu-img">
                            <img src="${item.img}" alt="${name}">
                        </div>
                        <div class="menu-details">
                            <h3 data-id="${item.id}" data-type="name">${name}</h3>
                            <p data-en="Freshly prepared with premium ingredients" data-ar="مُحضرة طازجة بأجود المكونات">
                                ${currentLang === 'ar' ? "مُحضرة طازجة بأجود المكونات" : "Freshly prepared with premium ingredients"}
                            </p>
                            <div class="card-footer">
                                <span class="price">${item.price} EGP</span>
                                <button class="add-btn" onclick="addToCart(${item.id})" data-en="Add to Cart" data-ar="أضف للسلة">
                                    ${currentLang === 'ar' ? "أضف للسلة" : "Add to Cart"}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Add to Cart with Feedback
        function addToCart(id) {
            const product = menuProducts.find(p => p.id === id);
            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
            
            // Visual Feedback
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = currentLang === 'ar' ? "✓ تم الإضافة" : "✓ Added";
            btn.style.borderColor = "var(--accent-emerald)";
            btn.style.color = "var(--accent-emerald)";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.borderColor = "var(--accent-gold)";
                btn.style.color = "var(--accent-gold)";
            }, 800);
        }

        function updateQty(id, change) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('downtown_cart', JSON.stringify(cart));
            const container = document.getElementById('cartItemsContainer');
            const badge = document.getElementById('cartBadge');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            const checkoutBtn = document.getElementById('checkoutBtn');

            let totalCount = 0;
            let totalPrice = 0;
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top:50px;" data-en="Your cart is empty" data-ar="السلة فارغة حالياً">${currentLang === 'ar' ? "السلة فارغة حالياً" : "Your cart is empty"}</p>`;
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
                cart.forEach(item => {
                    totalCount += item.qty;
                    totalPrice += item.price * item.qty;
                    const itemName = currentLang === 'ar' ? item.nameAr : item.nameEn;
                    container.innerHTML += `
                        <div class="cart-item">
                            <img src="${item.img}" alt="${itemName}">
                            <div class="cart-item-info">
                                <h4>${itemName}</h4>
                                <span>${item.price * item.qty} EGP</span>
                            </div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            badge.innerText = totalCount;
            totalPriceEl.innerText = totalPrice + " EGP";
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            drawer.classList.toggle('open');
            overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
        }

        function setOrderType(type) {
            orderType = type;
            document.getElementById('typeDelivery').classList.toggle('active', type === 'Delivery');
            document.getElementById('typePickup').classList.toggle('active', type === 'Pickup');
        }

        // WhatsApp Checkout cleanly formatted
        function checkoutWhatsApp() {
            if (cart.length === 0) return;

            let message = currentLang === 'ar' ? "✨ *طلب جديد من عيادة/كافيه داون تاون* ✨\n\n" : "✨ *New Order from DOWNTOWN* ✨\n\n";
            message += (currentLang === 'ar' ? `📦 نوع الطلب: *${orderType === 'Delivery' ? 'توصيل (Delivery)' : 'استلام من الفرع (Pickup)'}*\n` : `📦 Order Type: *${orderType}*\n`);
            message += "----------------------------------\n";
            
            let total = 0;
            cart.forEach((item, index) => {
                const name = currentLang === 'ar' ? item.nameAr : item.nameEn;
                message += `${index + 1}. ${name} x${item.qty} — *${item.price * item.qty} EGP*\n`;
                total += item.price * item.qty;
            });

            message += "----------------------------------\n";
            message += (currentLang === 'ar' ? `💰 *الإجمالي الكلي: ${total} EGP*\n\n` : `💰 *Total Amount: ${total} EGP*\n\n`);
            message += (currentLang === 'ar' ? "برجاء تأكيد الطلب وتفاصيل العنوان. شكراً لاختياركم داون تاون!" : "Please confirm the order and delivery details. Thank you for choosing DOWNTOWN!");

            const encodedMessage = encodeURIComponent(message);
            const phone = "201500576313";
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');

            // Clear Cart after successful order
            cart = [];
            updateCart();
            toggleCart();
        }

        // Toggle Language (AR / EN)
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const root = document.getElementById('htmlRoot');
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            root.setAttribute('lang', currentLang);
            root.setAttribute('data-lang', currentLang);

            document.querySelectorAll('[data-en]').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) el.innerText = text;
            });

            renderMenu();
            updateCart();
        }

        // Initial load
        renderMenu();
        updateCart();
    </script>
</body>
</html>
