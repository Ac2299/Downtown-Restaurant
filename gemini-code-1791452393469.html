<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOWNTOWN | Premium Café & Desserts</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* الثيمات (ليلي ونهاري) */
        [data-theme="dark"] {
            --bg-deep: #090B0A;
            --bg-card: rgba(18, 25, 22, 0.75);
            --accent-gold: #D4AF37;
            --accent-gold-light: #F3E5AB;
            --accent-emerald: #00F5A0;
            --text-main: #F0F4F1;
            --text-muted: #9BAA9E;
            --border-glass: rgba(212, 175, 55, 0.2);
            --nav-bg: rgba(9, 11, 10, 0.85);
            --drawer-bg: #0D1310;
        }

        [data-theme="light"] {
            --bg-deep: #F4F7F5;
            --bg-card: rgba(255, 255, 255, 0.85);
            --accent-gold: #9c7b15;
            --accent-gold-light: #70550c;
            --accent-emerald: #00875a;
            --text-main: #1A231E;
            --text-muted: #5A6B62;
            --border-glass: rgba(156, 123, 21, 0.25);
            --nav-bg: rgba(244, 247, 245, 0.9);
            --drawer-bg: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            transition: background 0.4s ease, color 0.4s ease;
            position: relative;
        }

        ::-webkit-scrollbar { width: 8px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-deep); }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 4px; }

        /* Navbar */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glass);
            transition: 0.4s;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent-gold);
            text-decoration: none;
        }

        .nav-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--accent-gold);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
            transform: translateY(-2px);
        }

        .cart-badge {
            background: #ff4757;
            color: white;
            padding: 2px 6px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        /* Floating Controls (Translation & Theme) */
        .floating-controls {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1001;
        }

        .float-ctrl-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--accent-gold);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(10px);
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .float-ctrl-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
            transform: scale(1.1);
        }

        /* Hero Section */
        header.hero {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding: 0 20px;
            background: radial-gradient(circle at center, rgba(0,245,160,0.06) 0%, var(--bg-deep) 75%);
        }

        .hero-content {
            max-width: 900px;
            z-index: 2;
        }

        .hero h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.8rem;
            letter-spacing: 5px;
            color: var(--accent-gold);
            margin-bottom: 15px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInSlide 1s forwards 0.3s;
        }

        .hero p.tagline {
            font-size: 1.3rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--text-main);
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInSlide 1s forwards 0.6s;
        }

        .hero p.sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInSlide 1s forwards 0.9s;
        }

        @keyframes fadeInSlide {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Horizontal Categories Bar (في البداية وتصفح جانبي) */
        section {
            padding: 60px 40px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .section-title h2 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .categories-track {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 5px 25px 5px;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            justify-content: center;
        }

        .category-chip {
            flex: 0 0 auto;
            scroll-snap-align: start;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 12px 28px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }

        .category-chip:hover, .category-chip.active {
            background: var(--accent-gold);
            color: var(--bg-deep);
            border-color: var(--accent-gold);
            box-shadow: 0 5px 20px rgba(212,175,55,0.3);
            transform: translateY(-2px);
        }

        /* Products Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .menu-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInCard 0.6s forwards;
        }

        @keyframes fadeInCard {
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-card:hover {
            border-color: var(--accent-gold);
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        }

        .menu-img {
            height: 220px;
            background: #141c18;
            position: relative;
            overflow: hidden;
        }

        .menu-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
        }

        .menu-card:hover .menu-img img {
            transform: scale(1.08);
        }

        .menu-details {
            padding: 25px;
        }

        .menu-details h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        .menu-details p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-emerald);
        }

        .add-btn {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-deep);
            transform: scale(1.05);
        }

        /* Cart Drawer */
        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: 0.3s;
        }

        .cart-drawer {
            position: fixed;
            top: 0;
            right: -450px;
            width: 450px;
            max-width: 100%;
            height: 100%;
            background: var(--drawer-bg);
            border-left: 1px solid var(--border-glass);
            z-index: 2001;
            display: flex;
            flex-direction: column;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: -10px 0 40px rgba(0,0,0,0.5);
        }

        .cart-drawer.open { right: 0; }

        .cart-header {
            padding: 25px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 1.3rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-cart:hover { color: var(--accent-gold); }

        .cart-body {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .cart-item img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-info { flex: 1; }

        .cart-item-info h4 {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .cart-item-info span {
            color: var(--accent-emerald);
            font-size: 0.85rem;
            font-weight: 700;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qty-btn {
            background: var(--bg-deep);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover { border-color: var(--accent-gold); }

        .cart-footer {
            padding: 25px;
            border-top: 1px solid var(--border-glass);
            background: var(--bg-card);
        }

        .order-type-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .type-btn {
            background: var(--bg-deep);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            transition: 0.3s;
        }

        .type-btn.active {
            background: var(--accent-gold);
            color: var(--bg-deep);
            border-color: var(--accent-gold);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .cart-total span:last-child { color: var(--accent-emerald); }

        .checkout-btn {
            width: 100%;
            background: var(--accent-emerald);
            color: #090B0A;
            border: none;
            padding: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .checkout-btn:hover {
            background: #00c982;
            box-shadow: 0 0 20px rgba(0,245,160,0.4);
        }

        .checkout-btn:disabled {
            background: rgba(100,100,100,0.2);
            color: rgba(150,150,150,0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        footer {
            text-align: center;
            padding: 40px;
            border-top: 1px solid var(--border-glass);
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media(max-width: 768px) {
            nav { padding: 15px 20px; }
            .hero h1 { font-size: 2.5rem; }
            section { padding: 40px 20px; }
            .cart-drawer { width: 100%; right: -100%; }
        }
    </style>
</head>
<body data-lang="en">

    <!-- Navbar -->
    <nav>
        <a href="#" class="logo" data-en="DOWNTOWN" data-ar="داون تاون">DOWNTOWN</a>
        <div class="nav-right">
            <button class="nav-btn" onclick="toggleCart()">
                🛒 <span data-en="Cart" data-ar="السلة">Cart</span> 
                <span class="cart-badge" id="cartBadge">0</span>
            </button>
        </div>
    </nav>

    <!-- Floating Action Buttons (Translation & Theme) -->
    <div class="floating-controls">
        <button class="float-ctrl-btn" onclick="toggleLanguage()" title="Switch Language" id="langFloatBtn">AR</button>
        <button class="float-ctrl-btn" onclick="toggleTheme()" title="Toggle Theme" id="themeFloatBtn">☀️</button>
    </div>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1 data-en="DOWNTOWN" data-ar="داون تاون">DOWNTOWN</h1>
            <p class="tagline" data-en="Savor the Luxury, Love the Brew." data-ar="استمتع بالفخامة، وأحب القهوة.">Savor the Luxury, Love the Brew.</p>
            <p class="sub" data-en="Advanced Café & Artisanal Desserts" data-ar="كافيه فاخر وحلويات استثنائية">Advanced Café & Artisanal Desserts</p>
        </div>
    </header>

    <!-- Categories & Menu Section -->
    <section id="menu-section">
        <div class="section-title">
            <h2 data-en="Explore Our Categories" data-ar="استكشف أقسامنا المميزة">Explore Our Categories</h2>
        </div>
        
        <!-- الأقسام في البداية وتصفح جانبي أفقياً -->
        <div class="categories-track" id="categoriesTrack">
            <!-- Rendered via JS -->
        </div>

        <div class="menu-grid" id="menuGrid">
            <!-- Products rendered dynamically -->
        </div>
    </section>

    <!-- Cart Sidebar Drawer -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3 data-en="Your Luxury Cart" data-ar="سلة طلباتك الفاخرة">Your Luxury Cart</h3>
            <button class="close-cart" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-body" id="cartItemsContainer">
            <!-- Cart items added dynamically -->
        </div>
        <div class="cart-footer">
            <div class="order-type-box">
                <button class="type-btn active" id="typeDelivery" onclick="setOrderType('Delivery')" data-en="Delivery" data-ar="توصيل">Delivery</button>
                <button class="type-btn" id="typePickup" onclick="setOrderType('Pickup')" data-en="Pickup" data-ar="استلام من الفرع">Pickup</button>
            </div>
            <div class="cart-total">
                <span data-en="Total:" data-ar="الإجمالي:">Total:</span>
                <span id="cartTotalPrice">0 EGP</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" onclick="checkoutWhatsApp()" data-en="Order via WhatsApp" data-ar="اطلب عبر واتساب">Order via WhatsApp</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p data-en="© 2026 DOWNTOWN Café. All Rights Reserved." data-ar="© 2026 كافيه داون تاون. جميع الحقوق محفوظة.">© 2026 DOWNTOWN Café. All Rights Reserved.</p>
    </footer>

    <!-- Script Application Logic -->
    <script>
        const categories = [
            { id: 'all', nameEn: 'All Specialties', nameAr: 'جميع الأصناف' },
            { id: 'dessert', nameEn: 'Artisanal Desserts', nameAr: 'حلويات فاخرة' },
            { id: 'beverages', nameEn: 'Cold Beverages', nameAr: 'مشروبات باردة' },
            { id: 'coffee', nameEn: 'Specialty Coffee', nameAr: 'قهوة مختصة' },
            { id: 'waffle', nameEn: 'Waffles & Pancakes', nameAr: 'وافل وبان كيك' }
        ];

        const products = [
            { id: 1, cat: 'dessert', nameEn: "Nutella Donut", nameAr: "نوتيلا دونتس", price: 120, img: "https://images.unsplash.com/photo-1621236378699-8599fac66a3d?w=500&auto=format&fit=crop&q=60" },
            { id: 2, cat: 'beverages', nameEn: "Iced Spanish Latte", nameAr: "آيس سبانيش لاتيه", price: 110, img: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500&auto=format&fit=crop&q=60" },
            { id: 3, cat: 'waffle', nameEn: "White Chocolate Waffle", nameAr: "وافل شوكولاتة بيضاء", price: 90, img: "https://images.unsplash.com/photo-1568051243851-f9b136146e97?w=500&auto=format&fit=crop&q=60" },
            { id: 4, cat: 'waffle', nameEn: "Mini Pancakes", nameAr: "ميني بان كيك", price: 100, img: "https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=500&auto=format&fit=crop&q=60" },
            { id: 5, cat: 'beverages', nameEn: "Signature Matcha Shake", nameAr: "ماتشا شيك مميز", price: 130, img: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=500&auto=format&fit=crop&q=60" },
            { id: 6, cat: 'coffee', nameEn: "Hot Espresso & Brew", nameAr: "إسبريسو وقهوة ساخنة", price: 75, img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500&auto=format&fit=crop&q=60" }
        ];

        let cart = JSON.parse(localStorage.getItem('downtown_cart')) || [];
        let currentLang = 'en';
        let currentTheme = 'dark';
        let activeCategory = 'all';
        let orderType = 'Delivery';

        function renderCategories() {
            const track = document.getElementById('categoriesTrack');
            track.innerHTML = '';
            categories.forEach(cat => {
                const name = currentLang === 'ar' ? cat.nameAr : cat.nameEn;
                const isActive = activeCategory === cat.id ? 'active' : '';
                track.innerHTML += `
                    <button class="category-chip ${isActive}" onclick="filterCategory('${cat.id}')">
                        ${name}
                    </button>
                `;
            });
        }

        function filterCategory(catId) {
            activeCategory = catId;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            
            const filtered = activeCategory === 'all' ? products : products.filter(p => p.cat === activeCategory);
            
            filtered.forEach(item => {
                const name = currentLang === 'ar' ? item.nameAr : item.nameEn;
                grid.innerHTML += `
                    <div class="menu-card">
                        <div class="menu-img">
                            <img src="${item.img}" alt="${name}">
                        </div>
                        <div class="menu-details">
                            <h3>${name}</h3>
                            <p data-en="Freshly prepared with premium ingredients" data-ar="مُحضرة طازجة بأجود المكونات">
                                ${currentLang === 'ar' ? "مُحضرة طازجة بأجود المكونات" : "Freshly prepared with premium ingredients"}
                            </p>
                            <div class="card-footer">
                                <span class="price">${item.price} EGP</span>
                                <button class="add-btn" onclick="addToCart(${item.id})" data-en="Add to Cart" data-ar="أضف للسلة">
                                    ${currentLang === 'ar' ? "أضف للسلة" : "Add to Cart"}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
            
            // Visual feedback
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = currentLang === 'ar' ? "✓ تم الإضافة" : "✓ Added";
            btn.style.borderColor = "var(--accent-emerald)";
            btn.style.color = "var(--accent-emerald)";
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.borderColor = "var(--accent-gold)";
                btn.style.color = "var(--accent-gold)";
            }, 800);
        }

        function updateQty(id, change) {
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty += change;
                if (item.qty <= 0) {
                    cart = cart.filter(c => c.id !== id);
                }
            }
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('downtown_cart', JSON.stringify(cart));
            const container = document.getElementById('cartItemsContainer');
            const badge = document.getElementById('cartBadge');
            const totalPriceEl = document.getElementById('cartTotalPrice');
            const checkoutBtn = document.getElementById('checkoutBtn');

            let totalCount = 0;
            let totalPrice = 0;
            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top:50px;" data-en="Your cart is empty" data-ar="السلة فارغة حالياً">${currentLang === 'ar' ? "السلة فارغة حالياً" : "Your cart is empty"}</p>`;
                checkoutBtn.disabled = true;
            } else {
                checkoutBtn.disabled = false;
                cart.forEach(item => {
                    totalCount += item.qty;
                    totalPrice += item.price * item.qty;
                    const itemName = currentLang === 'ar' ? item.nameAr : item.nameEn;
                    container.innerHTML += `
                        <div class="cart-item">
                            <img src="${item.img}" alt="${itemName}">
                            <div class="cart-item-info">
                                <h4>${itemName}</h4>
                                <span>${item.price * item.qty} EGP</span>
                            </div>
                            <div class="cart-item-controls">
                                <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            badge.innerText = totalCount;
            totalPriceEl.innerText = totalPrice + " EGP";
        }

        function toggleCart() {
            const drawer = document.getElementById('cartDrawer');
            const overlay = document.getElementById('cartOverlay');
            drawer.classList.toggle('open');
            overlay.style.display = drawer.classList.contains('open') ? 'block' : 'none';
        }

        function setOrderType(type) {
            orderType = type;
            document.getElementById('typeDelivery').classList.toggle('active', type === 'Delivery');
            document.getElementById('typePickup').classList.toggle('active', type === 'Pickup');
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return;

            let message = currentLang === 'ar' ? "✨ *طلب جديد من كافيه داون تاون* ✨\n\n" : "✨ *New Order from DOWNTOWN* ✨\n\n";
            message += (currentLang === 'ar' ? `📦 نوع الطلب: *${orderType === 'Delivery' ? 'توصيل (Delivery)' : 'استلام من الفرع (Pickup)'}*\n` : `📦 Order Type: *${orderType}*\n`);
            message += "----------------------------------\n";
            
            let total = 0;
            cart.forEach((item, index) => {
                const name = currentLang === 'ar' ? item.nameAr : item.nameEn;
                message += `${index + 1}. ${name} x${item.qty} — *${item.price * item.qty} EGP*\n`;
                total += item.price * item.qty;
            });

            message += "----------------------------------\n";
            message += (currentLang === 'ar' ? `💰 *الإجمالي الكلي: ${total} EGP*\n\n` : `💰 *Total Amount: ${total} EGP*\n\n`);
            message += (currentLang === 'ar' ? "برجاء تأكيد الطلب وتفاصيل العنوان. شكراً لاختياركم داون تاون!" : "Please confirm the order and delivery details. Thank you for choosing DOWNTOWN!");

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/201500576313?text=${encodedMessage}`, '_blank');

            cart = [];
            updateCart();
            toggleCart();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const root = document.getElementById('htmlRoot');
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            root.setAttribute('lang', currentLang);

            document.getElementById('langFloatBtn').innerText = currentLang === 'en' ? 'AR' : 'EN';

            document.querySelectorAll('[data-en]').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) el.innerText = text;
            });

            renderCategories();
            renderProducts();
            updateCart();
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.getElementById('htmlRoot').setAttribute('data-theme', currentTheme);
            document.getElementById('themeFloatBtn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
        }

        // Initial Load
        renderCategories();
        renderProducts();
        updateCart();
    </script>
</body>
</html>
